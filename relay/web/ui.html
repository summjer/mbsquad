<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squad Relay C++</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.c{background:#1e293b;border-radius:16px;padding:32px;max-width:520px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,.3)}h1{font-size:24px;margin-bottom:4px;color:#f8fafc}.b{display:inline-block;background:#7c3aed;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px}.sub{color:#94a3b8;font-size:14px;margin-bottom:24px}.fg{margin-bottom:16px}label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px}input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none}input:focus{border-color:#3b82f6}.h{font-size:12px;color:#64748b;margin-top:4px}.btn{display:inline-block;padding:12px 24px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}.bp{background:#3b82f6;color:#fff;width:100%}.bp:hover{background:#2563eb}.bp:disabled{background:#475569;cursor:not-allowed}.bs{padding:8px 16px;font-size:13px;background:#334155;color:#e2e8f0;border-radius:6px}.err{background:#7f1d1d;border:1px solid #dc2626;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#fca5a5;display:none}.ok{background:#14532d;border:1px solid #16a34a;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#86efac;display:none}.sb{margin-top:24px;padding-top:20px;border-top:1px solid #334155}.si{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid #1e293b}.d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dg{background:#22c55e}.dr{background:#ef4444}.dy{background:#eab308}.row{display:flex;gap:12px}.row>div{flex:1}.gc{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #334155;text-align:center}</style></head><body><div class="c"><h1>&#9889; Squad Relay <span class="b">C++</span></h1><p class="sub">原始日志批量推送 &rarr; 面板 LogParser</p><div id="rn" style="display:none"><div class="ok" style="display:block;text-align:center;font-size:16px;padding:20px">&#10004; Relay 运行中</div><div class="sb" id="sb"></div><div class="gc" id="gc"><div style="margin-bottom:8px;font-size:13px;color:#94a3b8">游戏服务器控制</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn bs" style="background:#15803d;color:#fff" onclick="ct('start')">&#9654; 启动</button><button class="btn bs" style="background:#dc2626;color:#fff" onclick="ct('stop')">&#9632; 停止</button><button class="btn bs" style="background:#b91c1c;color:#fff" onclick="ct('restart')">&#128260; 重启</button></div></div><div style="text-align:center;margin-top:16px"><button class="btn bs" onclick="rs()">重新配置</button></div></div><div id="cf"><div class="err" id="em"></div><div class="fg"><label>面板地址</label><input id="pu" value="http://82.156.215.119:3000"></div><div class="fg"><label>注册码</label><input id="rc" placeholder="从面板生成"><div class="h">面板「服务器管理 &rarr; 中继配置」生成</div></div><div class="fg"><label>服务器名称</label><input id="sn" placeholder="我的Squad服"></div><div class="fg"><label>服务器地址</label><input id="sh" placeholder="公网 IP"></div><div class="row"><div style="max-width:120px"><label>RCON 端口</label><input id="rp" placeholder="21114" type="number"></div><div><label>RCON 密码</label><input id="rps" type="password"></div></div><div class="fg" style="margin-top:16px"><label>日志目录</label><div style="display:flex;gap:8px"><input id="ld" style="flex:1"><button class="btn bs" onclick="dl()">检测</button></div></div><div class="fg"><label>游戏服务器 EXE</label><div style="display:flex;gap:8px"><input id="ge" style="flex:1"><button class="btn bs" onclick="de()">检测</button></div><div class="h">留空则不管理进程</div></div><div class="fg"><label>启动参数</label><input id="lp" placeholder="-log -Port=7787 QueryPort=27015 RCONPort=21114"></div><div class="fg" style="display:flex;align-items:center;gap:8px"><label style="margin:0"><input type="checkbox" id="ar"> 崩溃自动重启</label></div><button class="btn bp" id="sb2" onclick="sv()">注册并连接</button></div></div><script>let _c=null,pl=null;async function dl(){try{let r=await fetch('/api/detect-log'),d=await r.json();if(d.detected)document.getElementById('ld').value=d.detected}catch(e){}}async function de(){try{let r=await fetch('/api/detect-exe'),d=await r.json();if(d.detected&&d.detected.length)document.getElementById('ge').value=d.detected[0]}catch(e){}}function sr(sn){document.getElementById('cf').style.display='none';document.getElementById('rn').style.display='block';if(sn)document.querySelector('#rn .ok').innerHTML='&#10004; 已连接: '+sn}function rs(){clearInterval(pl);document.getElementById('rn').style.display='none';document.getElementById('cf').style.display='block';document.getElementById('sb2').disabled=false;document.getElementById('sb2').textContent='注册并连接'}function si(h,c,t){return'<div class="'+c+'"><span>'+t+'</span><span>'+h+'</span></div>'}function sp(){pl=setInterval(async()=>{try{let r=await fetch('/api/status'),d=await r.json(),s=d.relay[0]||d.relay,b=document.getElementById('sb'),h='';h+=si(s.panelOk?'<span class="d dg"></span>已连接':'<span class="d dr"></span>未连接','si','面板');h+=si(s.rconOk?'<span class="d dg"></span>已连接':'<span class="d dy"></span>未连接','si','RCON');h+=si(s.logDir||'-','si','日志');h+=si(String(s.eventsSent),'si','事件');if(s.errors&&s.errors.length)h+=si(s.errors[s.errors.length-1].substring(0,50),'si','错误');b.innerHTML=h;if(d.hasGameServerConfig)document.getElementById('gc').style.display='block'}catch(e){}},3000)}async function sv(){let btn=document.getElementById('sb2'),em=document.getElementById('em');btn.disabled=true;btn.textContent='连接中...';em.style.display='none';try{let cfg={panelUrl:document.getElementById('pu').value.trim(),registerCode:document.getElementById('rc').value.trim(),serverName:document.getElementById('sn').value.trim(),serverHost:document.getElementById('sh').value.trim(),logDir:document.getElementById('ld').value.trim()||null,rconPort:parseInt(document.getElementById('rp').value)||null,rconPassword:document.getElementById('rps').value||null,gameExePath:document.getElementById('ge').value.trim()||null,launchParams:document.getElementById('lp').value.trim()||null,autoRestart:document.getElementById('ar').checked};if(_c&&_c.apiKey)cfg.apiKey=_c.apiKey;let r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});let d=await r.json();if(d.error)throw new Error(d.error);sr(d.serverName);sp()}catch(e){em.textContent=e.message;em.style.display='block';btn.disabled=false;btn.textContent='注册并连接'}}async function ct(a){if(!confirm({start:'启动游戏服务器？',stop:'停止服务器？将断开所有玩家！',restart:'重启服务器？将断开所有玩家！'}[a]))return;try{await fetch('/api/server/'+a,{method:'POST'})}catch(e){alert('操作失败: '+e.message)}}async function init(){try{let r=await fetch('/api/config'),d=await r.json();if(d.config)_c=d.config;if(d.config&&d.config._token){sr(d.config._serverName||'Server');sp()}}catch(e){}}init();</script></body></html>
